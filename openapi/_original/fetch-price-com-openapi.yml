openapi: 3.1.0
info:
  title: fetch-price API
  version: 1.3.0
  summary: Live UK marketplace product and price search for AI agents and humans
  description: >-
    Live UK marketplace product search operated by POLICYANDPLAY LTD at https://api.fetch-price.com.
    One POST returns real listings with live GBP prices, condition, marketplace and an affiliate-tracked
    purchase URL, normalised to one JSON shape. eBay UK is live via the official eBay Browse API; Amazon
    UK is rolling out and currently returns a tracked search link (result_type search_link) rather than
    items. The free tier needs no API key (50 lookups/month); registering an agent issues an fp_-prefixed
    key that raises limits and enables bring-your-own affiliate tracking (BYOK) on paid plans. Every
    response carries X-RateLimit-Limit and X-RateLimit-Remaining; the fixed limit is 30 requests per
    minute per key or per IP. Purchase links are affiliate-tracked and the provider asks agents to pass
    that disclosure on to the human (https://fetch-price.com/privacy).
    PROVENANCE - the provider publishes no OpenAPI. This document was written by API Evangelist from the
    provider's own API reference at https://fetch-price.com/docs/ (the endpoint tables, field tables and
    captured live responses), the first-party SDK sources and the stdio MCP server source in
    https://github.com/fusionx212/fetch-price, and was checked against live unauthenticated responses
    from api.fetch-price.com on 2026-09-19 (see x-provenance). It is a description of a real, exercised
    API, not a first-party contract; treat the provider's docs as authoritative where they differ.
  contact:
