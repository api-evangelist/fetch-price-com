  api_key_in:
  - header
  anonymous_access: true
  note: 'Docs: "The free tier works without authentication (50 lookups/month). Register to get an fp_ key, higher
    limits, and BYOK affiliate routing ... Send the key on every request as X-API-Key: fp_... (or Authorization:
    Bearer fp_...)." One static credential, two carriers. No OAuth, no scopes, no key rotation endpoint. The key
    is emailed to the registering address by Resend, is never displayed in a public response after issuance, and
    is revoked by emailing the provider (privacy page). The stdio MCP server reads it from FETCH_PRICE_API_KEY and
    sends it as Bearer; both SDKs read the same variable and send X-API-Key.'
  transport: HTTPS only (HSTS on both hosts); header-borne; CORS allows X-API-Key and Authorization from any origin
