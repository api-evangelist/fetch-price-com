model: >-
  Freemium with a fixed free tier and flat monthly subscriptions bought through Stripe payment links.
  The provider states the model plainly on the docs page: "either we earn the commission, or you pay
  for the calls" - free-tier and untagged requests return links carrying fetch-price's own affiliate
  tracking; paid plans can route commission to the customer's own eBay Partner Network account (BYOK).
  No per-call overage is published; the metered unit is a "lookup" (one POST /api/query) per calendar
  month.
