summary: >-
  One published request-rate limit and four plan quotas. Docs: "30 requests/minute per key (or per IP
  when keyless). Every response carries X-RateLimit-Limit and X-RateLimit-Remaining headers; excess
  requests get HTTP 429. Monthly lookup quotas are per plan." Both headers were OBSERVED live on
  2026-09-19 on every api.fetch-price.com response, including 400s and 404s: X-RateLimit-Limit 30,
  X-RateLimit-Remaining counting down 30 -> 29 -> 27 across consecutive unauthenticated requests from
  one IP. No 429 was provoked.
rate_limits:
- id: per-minute
  scope: per-key (per-IP when no key is sent)
  window: 1 minute
  limit: 30
  burst: null
  applies_to: all endpoints on https://api.fetch-price.com (headers seen on /, /health, /api/stats, /api/query, /a2a)
  source: docs + observed headers
- id: quota-free
  scope: per-key or per-IP
  window: 1 month
  limit: 50 lookups (POST /api/query)
  plan: Free
  source: docs
- id: quota-pro
  scope: per-key
  window: 1 month
  limit: 5000 lookups
  plan: Pro (GBP 29/mo)
  source: docs
- id: quota-scale
  scope: per-key
  window: 1 month
  limit: unlimited
  plan: Scale (GBP 99/mo)
  source: docs
- id: quota-trade
  scope: per-key
  window: 1 month
  limit: unlimited
  plan: Trade (GBP 99/mo)
  source: docs
