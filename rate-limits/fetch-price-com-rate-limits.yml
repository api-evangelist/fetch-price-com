  client_guidance: >-
    Read X-RateLimit-Remaining on every response and pause before it reaches 0; on 429 wait for the
    next minute window (no reset time is signalled). A 429 can also mean the monthly quota is spent - the
    provider's MCP server surfaces that as "rate limit reached on current tier - see
    fetch-price.com/pricing"; the two causes are not distinguishable from the response.
  quota_visibility: >-
    No endpoint or header reports remaining monthly lookups; registration returns query_limit once.
