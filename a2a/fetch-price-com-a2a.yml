      which this pipeline does not do.
surface_relationship:
  note: >-
    fetch-price publishes FOUR agent-facing surfaces over ONE REST API. A2A: this card plus a JSON-RPC
    message/send binding on api.fetch-price.com (root or /a2a). MCP: a one-file stdio server in the
    public GitHub repo, listed in the official MCP registry (mcp/fetch-price-com-mcp.yml) - no hosted
    MCP endpoint. Agent Skill: a SKILL.md in the same repo (skills/). llms.txt + llms-full.txt on the
    apex. Both A2A skills map one-to-one onto REST operations: search_products -> POST /api/query,
    service_status -> GET /health (mcp/fetch-price-com-tool-crosswalk.yml).
