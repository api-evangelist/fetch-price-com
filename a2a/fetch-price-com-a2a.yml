conformance:
  spec: A2A 1.0.0
  grade: conformant
  protocol_version: 1.0.0
  preferred_transport: JSONRPC
  hard_checks:
    capabilities_is_object: true
    protocol_version_present: true
    skills_is_array: true
  optional_fields:
    preferred_transport: true
    default_input_modes: true
    default_output_modes: true
  grade_basis: >-
    All three hard checks pass: capabilities is an OBJECT ({streaming:false, pushNotifications:false}),
    protocolVersion is present at the top level ("1.0.0"), and skills is an ARRAY of two fully-formed
    skills (id, name, description, tags, examples). All three optional discriminators are present
    (preferredTransport JSONRPC, defaultInputModes, defaultOutputModes). The card uses the 0.3-era
    top-level url/preferredTransport/protocolVersion triple rather than 1.0.0's supportedInterfaces[],
    which the grading rubric does not penalise; noted under deviations because a strict 1.0.0 reader
    looking only at supportedInterfaces[] would find no interface.
  deviations:
  - field: supportedInterfaces
    observed: absent (url + preferredTransport at the top level instead)
    note: The 0.3-style shape. A2A 1.0.0 carries the binding on supportedInterfaces[].protocolBinding; the card declares protocolVersion 1.0.0 but the older field layout. Functionally unambiguous - one JSONRPC interface at https://api.fetch-price.com.
  - field: securitySchemes / security
    observed: absent
    note: The card declares no authentication. That is consistent with the REST surface (the free tier is keyless, counted per IP) and the endpoint answered anonymous JSON-RPC without a challenge, so this is an accurate description rather than an omission - but a paying agent has no card-level way to learn that an fp_ key can be sent as X-API-Key or Bearer.
  - field: url
    observed: https://api.fetch-price.com (host root)
    note: The API root states the A2A binding is POST / or POST /a2a. Unknown JSON-RPC methods return HTTP 404 with -32601, which is why a2aregistry.org's task-conformance smoke test records "404" - message/send itself answers (-32602 on an empty message).
  - field: skills[].inputModes / outputModes
    observed: absent (defaults apply)
    note: Optional; the registry normalises them to empty arrays.
  - field: version drift
    observed: card version 1.3.0; /health reports 1.3.0; /api/stats reports 1.2.0; the docs page examples still show 1.1.0
    note: Cosmetic, but an agent reconciling versions across surfaces will see three numbers.
