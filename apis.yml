aid: fetch-price-com
name: POLICYANDPLAY LTD
description: >-
  POLICYANDPLAY LTD (England & Wales, company no. 17253846) operates fetch-price, a UK product and price
  search API built for AI agents: one POST to api.fetch-price.com returns live eBay UK listings (via the
  official Browse API; Amazon UK rolling out) as normalised JSON with GBP prices, condition and an
  affiliate-tracked purchase URL. The free tier needs no API key (50 lookups/month, 30 requests/minute);
  Pro (GBP 29) and Scale/Trade (GBP 99) plans raise quotas and let customers route affiliate commission to
  their own eBay Partner Network account. The same API is exposed as a conformant A2A 1.0.0 agent card with
  a live JSON-RPC message/send binding, a stdio MCP server listed in the official MCP registry, a
  provider-authored SKILL.md, llms.txt, and npm/PyPI SDKs. No OpenAPI is published; the profile's spec was
  generated by API Evangelist from the provider's own reference and checked against the live host.
