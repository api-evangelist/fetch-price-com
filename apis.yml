apis:
  - name: fetch-price API
    description: >-
      REST API at https://api.fetch-price.com. POST /api/query searches live UK marketplace listings by
      plain-language query (max_results 1-20, max_price in GBP, networks ebay_uk / amazon_uk) and returns
      normalised results, each declaring result_type item (a real listing with live price, condition,
      image, item_id and an affiliate-tracked buy URL) or search_link (a tracked search URL with price 0
      for networks not yet live). POST /api/agents/register issues an fp_ API key; GET /health and GET
      /api/stats are public. Keyless on the free tier; X-API-Key or Bearer otherwise. Every response
      carries X-RateLimit-Limit and X-RateLimit-Remaining; 429 on the 30/minute limit or the plan quota.
      Documented in HTML only - the OpenAPI here is API Evangelist-generated from that reference and
      confirmed against live responses on 2026-09-19.
    humanURL: https://fetch-price.com/docs/
    baseURL: https://api.fetch-price.com
    tags:
      - Price Comparison
      - Product Search
      - E-Commerce
      - eBay
      - United Kingdom
    tags_raw:
      - Price Comparison
      - Product Search
      - eCommerce
      - eBay
      - United Kingdom
