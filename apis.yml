apis:
- name: fetch-price A2A Agent
  description: >-
    Agent-to-Agent surface declared by the A2A 1.0.0 agent card at https://fetch-price.com/.well-known/agent-card.json
    (also served at the legacy agent.json path and on api.fetch-price.com): a JSONRPC binding at https://api.fetch-price.com
    (POST / or /a2a) with two skills, search_products and service_status, that map one-to-one onto POST
    /api/query and GET /health. streaming and pushNotifications are false; no security scheme is declared,
    consistent with the keyless free tier. message/send is live - an empty message returns JSON-RPC -32602
    "No text part supplied" - while unknown methods return HTTP 404 with -32601. Graded conformant.
  humanURL: https://fetch-price.com/docs/
