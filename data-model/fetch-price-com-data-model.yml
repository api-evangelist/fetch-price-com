note: >-
  A deliberately small model - four endpoints, no resource ids beyond the marketplace's own. There are
  no $ref chains to walk; the relationships below are those the docs and SDKs state.
entities:
- name: Agent
  description: A registered API consumer (POST /api/agents/register). Identified by agent_id (prefix agent-); authenticated by api_key (prefix fp_).
  fields: [agent_id, api_key, name, owner, endpoint, networks, commission_split, tier, query_limit]
  id_prefix: agent-
  key_prefix: fp_
- name: Query
  description: A single product search request (POST /api/query). Not persisted for the caller; logged server-side for <= 30 days.
  fields: [query, max_results, max_price, min_price, currency, networks]
- name: Result
  description: One normalised marketplace listing returned by a Query.
  fields: [product, price, currency, condition, network, result_type, item_id, image, url, seller_rating]
  discriminator: result_type (item | search_link)
  external_id: item_id (marketplace-native, e.g. eBay Browse API v1|<legacy item id>|0)
- name: Network
  description: A supported marketplace - ebay_uk (live, eBay Browse API + eBay Partner Network) or amazon_uk (rolling out, Amazon Associates).
  fields: [id, live]
  enum: [ebay_uk, amazon_uk]
- name: Plan
  description: Commercial tier - Free, Pro, Scale, Trade (plans/fetch-price-com-plans-pricing.yml). Sets query_limit and BYOK eligibility.
  fields: [name, price, quota, byok]
- name: Health
  description: Service status snapshot (GET /health).
  fields: [status, version, networks, ebay_live]
- name: Stats
  description: Public counters (GET /api/stats).
  fields: [agents_active, networks_available, version]
