generated: '2026-09-19'
method: probed
source: >-
  Live unauthenticated requests to https://api.fetch-price.com on 2026-09-19 (POST /api/query with an
  empty body, GET /api/query, GET /openapi.json and other unknown paths, JSON-RPC POSTs to / and /a2a),
  plus the documented 401/429 behaviour in https://fetch-price.com/docs/ and the status-code handling
  in the first-party MCP server source.
docs: https://fetch-price.com/docs/#limits
format: plain-json
envelope:
  rest:
    media_type: application/json
    shape: '{"error": "<human-readable message>", "results": []}  (results present on /api/query; other paths return {"error": "..."} alone)'
    note: Not RFC 9457. No machine-readable code, no type URI, no request id. The message string is the only discriminator.
  a2a:
    media_type: application/json
    shape: JSON-RPC 2.0 error object {jsonrpc, id, error:{code, message}}; HTTP status mirrors the class (404 for -32601, 400 for -32602)
consistency_gap: >-
  No error reference is published; the docs mention only "excess requests get HTTP 429". The REST
  envelope is consistent (always an error string) but carries no stable code, so clients - including
  the provider's own MCP server - branch on HTTP status alone. The A2A surface uses standard JSON-RPC
  codes but pairs them with non-200 HTTP statuses, which some JSON-RPC clients and a2aregistry.org's
  smoke test read as a transport failure.
